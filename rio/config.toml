# See the full configuration reference: https://rioterm.com/docs/config

theme = "tokyonight"

padding = [0]
confirm-before-quit = false
copy-on-select = true
hide-mouse-cursor-when-typing = true
line-height = 1.1

[cursor]
shape = "block"
blinking = true

[navigation]
mode = "Plain"
use-split = true
unfocused-split-opacity = 0.8

[panel]
row-gap = 4
column-gap = 4
border-radius = 6.0

[editor]
program = "nvim"
args = []

[window]
mode = "Maximized"
blur = true
opacity = 0.8
opacity-cells = true
decorations = "Disabled"

[fonts]
size = 15
family = "CaskaydiaCove Nerd Font"
features = ["calt", "liga"]

[fonts.regular]
weight = 600

[bindings]
keys = [
  { key = "n", with = "control | shift", action = "None" },
  { key = "t", with = "control | shift", action = "None" },
  { key = "d", with = "control | shift", action = "None" },
  { key = "e", with = "control | shift", action = "None" },
]
